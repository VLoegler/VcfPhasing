name: phasevcf

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.12

  # VCF manipulation
  - bcftools=1.24
  - htslib=1.24
  - tabix=1.11

  # BAM manipulation
  - samtools=1.24

  # Long-read mapping
  - minimap2=2.31

  # Phasing
  - whatshap=2.8

  # Python libraries
  - cyvcf2=0.34.0
  - pysam=0.24.1
